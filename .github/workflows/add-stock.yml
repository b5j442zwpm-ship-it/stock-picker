name: Add stock (הוספת מניה)

# Adds a ticker to tickers.txt and rebuilds the data, so the stock gets a full check on the dashboard.
on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "סימול המניה כמו ב-Yahoo Finance (למשל SHOP, או TEVA.TA למניות ת\"א)"
        required: true
      name_he:
        description: "שם בעברית (לא חובה)"
        required: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate and add symbol
        env:
          SYMBOL: ${{ inputs.symbol }}
          NAME_HE: ${{ inputs.name_he }}
        run: python scripts/add_stock.py
      - run: python scripts/build_data.py
      - name: Commit
        run: |
          git config user.name "stock-picker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tickers.txt docs
          git diff --cached --quiet && exit 0
          git commit -m "Add ${{ inputs.symbol }} and update data"
          for i in 1 2 3 4; do git pull --rebase && git push && exit 0; echo "push failed, retry $i"; sleep $((i * 20)); done
          exit 1
