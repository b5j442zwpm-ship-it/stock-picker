<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8">
<title>בורר המניות</title>
<meta name="description" content="בדיקת מניות וקרנות סל בעברית: לקנות עכשיו, לחכות או לא לקנות, עם הסבר.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="בורר המניות">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f8;--card:#fff;--ink:#151922;--muted:#5f6878;--line:#e4e7ec;--soft:#eef1f5;
  --accent:#2357d9;--pos:#11805b;--neg:#c3352b;--warn:#a86400;
  --posbg:#e3f4ec;--negbg:#fbe9e7;--warnbg:#fbf0dc;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1218;--card:#171b23;--ink:#e9ecf1;--muted:#9aa3b1;--line:#2a303b;--soft:#202632;
  --accent:#86a8ff;--pos:#41d19a;--neg:#ff7d71;--warn:#f1b443;
  --posbg:#173326;--negbg:#3a1e1c;--warnbg:#3a2d14;}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Assistant,system-ui,sans-serif;font-size:17px;line-height:1.55}
a{color:var(--accent)}
.wrap{max-width:860px;margin:0 auto;padding:18px 16px 90px}
h1{margin:0;font-size:28px;font-weight:800}
h2{font-size:20px;margin:0 0 10px;font-weight:800}
h3{font-size:16px;margin:16px 0 6px}
.muted{color:var(--muted)} .small{font-size:14px} .tiny{font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.disc{font-size:13.5px;color:var(--muted);margin:0 0 14px}
.warnbox{border:1px solid var(--warn);color:var(--warn);border-radius:12px;padding:8px 12px;margin-bottom:12px;font-size:14px}
/* search */
.search h2{font-size:22px}
.sq{display:flex;gap:8px}
.sq input{flex:1;min-width:0;font:inherit;font-size:18px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.sq input:focus{outline:2px solid var(--accent);border-color:transparent}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 20px;background:var(--accent);color:#fff;cursor:pointer;white-space:nowrap}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0f1218}}
.sugg{margin-top:8px;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
.sugg.on{display:block}
.sugg button{display:flex;width:100%;justify-content:space-between;gap:8px;border:0;border-bottom:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:10px 12px;text-align:start;cursor:pointer}
.sugg button:last-child{border-bottom:0}
.sugg button:hover{background:var(--soft)}
.notfound{margin-top:10px}
/* market light */
.light{display:flex;gap:12px;align-items:flex-start}
.dotbig{flex:none;width:18px;height:18px;border-radius:50%;margin-top:6px}
.d-positive{background:var(--pos)} .d-neutral{background:var(--warn)} .d-negative{background:var(--neg)}
details summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:15px;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"◂ ";display:inline-block;transition:transform .15s}
details[open] summary::before{transform:rotate(-90deg)}
ul.plain{margin:8px 0 0;padding-inline-start:20px} ul.plain li{margin:3px 0}
/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;font-size:15px;border-radius:999px;padding:8px 14px;cursor:pointer}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab .n{font-weight:600;opacity:.7}
/* stock rows / cards */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:var(--soft)}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm span{font-size:13px;color:var(--muted)}
.row .side{text-align:end;font-size:13px;color:var(--muted);white-space:nowrap}
.vd{display:inline-block;border-radius:999px;padding:3px 11px;font-weight:800;font-size:14px;white-space:nowrap}
.v-buy{background:var(--posbg);color:var(--pos)} .v-wait{background:var(--warnbg);color:var(--warn)} .v-avoid{background:var(--negbg);color:var(--neg)}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:999px;padding:5px 12px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--card)}
.empty{padding:20px 6px;color:var(--muted);text-align:center}
.alert{display:inline-block;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);border-radius:8px;padding:1px 8px;font-size:13px;font-weight:700;margin-top:3px}
/* stock page */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:10}
.ov.on{display:block}
.page{position:fixed;inset:0 auto 0 0;width:min(600px,100%);background:var(--bg);z-index:11;overflow:auto;padding:14px 16px 100px;transform:translateX(-105%);transition:transform .2s;overscroll-behavior:contain}
.page.on{transform:none}
.page.wide{width:min(920px,100%)}
.pbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.x{border:0;background:var(--soft);color:var(--ink);border-radius:10px;min-width:40px;height:40px;font-size:15px;font-weight:700;cursor:pointer;padding:0 12px}
.verdict{border-radius:16px;padding:16px;margin:12px 0}
.verdict .big{font-size:30px;font-weight:800;line-height:1.15}
.verdict p{margin:6px 0 0;color:var(--ink);font-size:18px}
.vb-buy{background:var(--posbg);color:var(--pos)} .vb-wait{background:var(--warnbg);color:var(--warn)} .vb-avoid{background:var(--negbg);color:var(--neg)}
.why{list-style:none;margin:0;padding:0}
.why li{display:grid;grid-template-columns:26px 1fr;gap:8px;padding:7px 0;align-items:start}
.ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;margin-top:2px}
.ic.good{background:var(--pos)} .ic.ok{background:var(--warn)} .ic.bad{background:var(--neg)} .ic.na{background:var(--muted)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ic{color:#10131a}}
.why b{display:block;font-size:15px}
.why div>span{color:var(--muted);font-size:15px}
.plan{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.plan div{border-radius:12px;padding:10px 12px;background:var(--soft)}
.plan b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.plan span{font-size:13.5px;color:var(--muted)}
.meter{display:flex;gap:4px;margin:8px 0 4px}
.meter i{flex:1;height:10px;border-radius:5px;background:var(--soft)}
.meter i.f1{background:#2fa36b}.meter i.f2{background:#86b83a}.meter i.f3{background:#d1a320}.meter i.f4{background:#e07a2c}.meter i.f5{background:#d8443a}
.acts{display:flex;gap:8px;margin-top:4px}
.btn2{flex:1;font:inherit;font-weight:700;font-size:15px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px;cursor:pointer}
.btn2.on{border-color:var(--accent);color:var(--accent)}
.page details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}
.page details[open] summary{margin-bottom:6px}
.news a{color:inherit;text-decoration:none} .news li{padding:6px 0;border-bottom:1px solid var(--line);list-style:none;font-size:14.5px}
.news ul{margin:0;padding:0}
.mt{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:13px}
@media(max-width:460px){.mt{grid-template-columns:repeat(2,1fr)}}
.mt div{background:var(--soft);border-radius:8px;padding:6px 8px} .mt b{display:block;font-size:15px}
.cmp{width:100%;border-collapse:collapse;font-size:14px}
.cmp th,.cmp td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
.cmp th{color:var(--muted);font-weight:600}
.cmp thead th{color:var(--ink);font-size:15px}
.tw{overflow-x:auto}
.tbar{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 8px 8px 16px;display:none;gap:10px;align-items:center;z-index:12;box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:14px;max-width:calc(100% - 32px)}
.tbar.on{display:flex}
body.pgopen .tbar{display:none}
.more{width:100%;margin-top:8px}
.tbar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbar button{font:inherit;font-weight:800;border:0;border-radius:999px;padding:6px 14px;cursor:pointer;flex:none}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.stat div{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px}
.stat b{display:block;font-size:22px}
dl.gl dt{font-weight:800;margin-top:10px} dl.gl dd{margin:2px 0 0;color:var(--muted)}
.spin{padding:30px;text-align:center;color:var(--muted)}
/* my stocks */
.hform{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;align-items:end;margin:6px 0 4px}
@media(max-width:560px){.hform{grid-template-columns:1fr 1fr}.hform .f-sym,.hform .btn{grid-column:1/-1}}
.hform label{display:flex;flex-direction:column;font-size:13px;color:var(--muted);gap:3px;min-width:0}
.hform input,.inp{font:inherit;font-size:16px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);min-width:0;width:100%}
.hform .btn{padding:10px 18px}
.ferr{color:var(--neg);font-size:14px;margin-top:4px}
.sig{font-size:13px;color:var(--pos);margin-top:2px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 12px}
@media(max-width:460px){.sum{grid-template-columns:1fr 1fr}}
.sum div{background:var(--soft);border-radius:12px;padding:8px 12px;font-size:13.5px;color:var(--muted)}
.sum b{display:block;font-size:19px;color:var(--ink);font-variant-numeric:tabular-nums}
.v-add{background:var(--posbg);color:var(--pos)} .v-sell{background:var(--negbg);color:var(--neg)} .v-hold{background:var(--warnbg);color:var(--warn)}
.vb-add{background:var(--posbg);color:var(--pos)} .vb-sell{background:var(--negbg);color:var(--neg)} .vb-hold{background:var(--warnbg);color:var(--warn)}
.hwhy{font-size:13.5px;color:var(--ink);margin-top:2px}
.hedit{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.hedit label{display:flex;flex-direction:column;font-size:13px;color:var(--muted);gap:3px}
/* upgrade: header, index strip, groups, list tools, sparklines, chart */
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:36px;height:36px;border-radius:10px}
.idx{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 12px;padding:2px 16px;scrollbar-width:none}
.idx::-webkit-scrollbar{display:none}
.idx div{flex:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 12px;font-size:13px;color:var(--muted);line-height:1.35}
.idx b{display:block;color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cat{display:flex;align-items:center;gap:10px;text-align:start;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:10px 12px;font:inherit;cursor:pointer;min-width:0;transition:border-color .15s,transform .1s}
.cat:hover{border-color:var(--accent)} .cat:active{transform:scale(.98)}
.cat .e{font-size:22px;flex:none;line-height:1}
.cat b{display:block;font-size:14.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis}
.cat span.c{font-size:12.5px;color:var(--muted)}
.cat.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--card))}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.tools .inp{font-size:16px}
.tools .q{grid-column:1/-1;position:relative}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:14px 55%,9px 55%;background-size:5px 5px;background-repeat:no-repeat;padding-left:28px;padding-right:10px;text-overflow:ellipsis}
.cnt{font-size:13px;color:var(--muted);margin:2px 0 4px}
.spk{flex:none;width:64px;height:28px}
@media(max-width:380px){.spk{width:48px}}
.tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:6px;padding:0 6px;background:var(--soft);color:var(--muted);vertical-align:1px;margin-inline-start:4px}
.chart{margin:10px 0 2px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px 6px}
.chart svg{display:block;width:100%;height:150px}
.chart .lg{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);flex-wrap:wrap;gap:4px 10px}
.acts{display:grid;grid-template-columns:repeat(4,1fr)}
@media(max-width:420px){.acts{grid-template-columns:1fr 1fr}}
.btn2{padding:10px 6px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--soft),var(--line),var(--soft));background-size:200% 100%;animation:sk 1.2s infinite;margin:10px 0}
@keyframes sk{to{background-position:-200% 0}}
.totop{position:fixed;bottom:18px;inset-inline-start:16px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;box-shadow:0 4px 14px rgba(0,0,0,.15);cursor:pointer;display:none;z-index:9}
.totop.on{display:block}
body.pgopen .totop{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><img src="icon.svg" alt=""><h1>בורר המניות</h1></div>
    <div class="muted tiny" id="updated">טוען…</div>
  </div>
  <p class="disc">⚠️ כלי עזר, לא ייעוץ השקעות. הוא בודק עובדות על כל מניה ומסכם אותן, אבל אף אחד לא יודע מה יקרה מחר. <a href="#" onclick="openGlossary();return false">מה כל מושג אומר?</a></p>
  <div id="warn"></div>

  <section class="card search">
    <h2>איזו מניה מעניינת אותך?</h2>
    <form class="sq" id="sform" autocomplete="off">
      <input id="sq" placeholder="למשל: אפל, טבע, NVDA, זהב" aria-label="חיפוש מניה" enterkeyhint="search">
      <button class="btn" type="submit">בדוק</button>
    </form>
    <div class="sugg" id="sugg"></div>
    <div id="nf"></div>
    <p class="muted tiny" style="margin:8px 0 0">התשובה: <span class="vd v-buy">לקנות עכשיו</span> <span class="vd v-wait">לחכות</span> או <span class="vd v-avoid">לא לקנות</span>, עם הסבר למה.</p>
  </section>

  <div class="idx" id="idx"></div>
  <section class="card" id="market"><div class="skel" style="width:60%"></div><div class="skel"></div><div class="skel" style="width:80%"></div></section>

  <section class="card" id="cats"></section>

  <div class="tabs" id="tabs" role="tablist"></div>
  <section class="card" id="panel"></section>

  <section class="card" id="track"></section>
</div>

<div class="tbar" id="tbar"></div>
<button class="totop" id="totop" onclick="scrollTo({top:0,behavior:'smooth'})" aria-label="לראש העמוד">↑</button>
<div class="toast" id="toast"></div>
<div class="ov" id="ov"></div>
<aside class="page" id="pg" aria-live="polite"></aside>

<script>
const VERD={buy:'לקנות עכשיו',wait:'לחכות',avoid:'לא לקנות'}, VICON={buy:'🟢',wait:'🟡',avoid:'🔴'}, VORD={buy:3,wait:2,avoid:1};
const RISKW=['','רגועה מאוד','רגועה','בינונית','קופצת חזק','קופצת חזק מאוד'];
const RISKS=['','מניה יציבה. בדרך כלל זזה מעט.','מניה די יציבה.','תנודות רגילות: יש ימים של עליות וירידות של כמה אחוזים.','מניה שזזה הרבה. יכולה לרדת 30% ויותר בתקופה קשה.','מניה שזזה חזק מאוד. יכולה לרדת בחצי בתקופה קשה. מתאים רק לכסף שאפשר להרשות לעצמך להפסיד.'];
const SECT={'Technology':'טכנולוגיה','Financial Services':'פיננסים','Healthcare':'בריאות','Consumer Cyclical':'צריכה','Consumer Defensive':'מוצרי יסוד',
 'Communication Services':'תקשורת ומדיה','Industrials':'תעשייה','Energy':'אנרגיה','Utilities':'חשמל ותשתיות','Real Estate':'נדל"ן','Basic Materials':'חומרי גלם'};
let showAll=0, showUp=0, showDip=0, D=null, tab='buy', vf='', mf='', gf='', aq='', sortk='best', lim=40, catsOpen=0, W={}, H={}, CMP=[], cache={};
const SORTS=[['best','מיון: ההמלצה הכי טובה'],['opp','הזדמנות: מחיר טוב וסימנים לעלייה'],['up3m','עלו הכי הרבה ב-3 חודשים'],['day','עלו הכי הרבה היום'],['down','ירדו הכי הרבה היום'],['y1','עלו הכי הרבה בשנה'],['high','הכי קרובות לשיא השנתי'],['risk','הכי רגועות (סיכון נמוך)'],['upside','פוטנציאל לפי אנליסטים'],['cap','החברות הגדולות']];
try{W=JSON.parse(localStorage.getItem('sp_watch')||'{}')}catch(e){}
try{H=JSON.parse(localStorage.getItem('sp_hold')||'{}')}catch(e){}
try{tab=localStorage.getItem('sp_tab')||'buy'}catch(e){}

const $=s=>document.querySelector(s);
const L=t=>'⁦'+t+'⁩';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=(x,d=0)=>x==null||!isFinite(x)?'—':L((x>0?'+':'')+(x*100).toFixed(d)+'%');
const cls=x=>x==null?'':x>=0?'pos':'neg';
const num=(x,d=2)=>x==null||!isFinite(x)?'—':L(Number(x).toLocaleString('he-IL',{maximumFractionDigits:d}));
const cur=s=>s.currency==='ILA'?'אג׳':s.currency==='USD'?'$':(s.currency||'');
const nm=s=>s.name_he||s.name;
const byS=sym=>D.stocks.find(s=>s.symbol===sym);
const repoLink=(p)=>{const m=location.hostname.match(/^([^.]+)\.github\.io$/);return m?`https://github.com/${m[1]}/${location.pathname.split('/')[1]||'stock-picker'}/${p}`:null};
const gEmoji=g=>(g||'').split(' ')[0];
const gName=g=>(g||'').split(' ').slice(1).join(' ')||g||'';
let _G=null;
function groups(){
  if(_G) return _G; const m=new Map();
  D.stocks.forEach(s=>{if(!s.group)return; if(!m.has(s.group))m.set(s.group,{g:s.group,n:0,b:0}); const x=m.get(s.group); x.n++; if(s.consult.verdict==='buy')x.b++});
  return _G=[...m.values()];
}
function spark(a,w=64,h=28){
  if(!a||a.length<2) return '';
  const mn=Math.min(...a),mx=Math.max(...a),r=mx-mn||1,up=a[a.length-1]>=a[0];
  const pts=a.map((v,i)=>`${(i/(a.length-1)*w).toFixed(1)},${(h-2-(v-mn)/r*(h-4)).toFixed(1)}`).join(' ');
  return `<svg class="spk" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" style="fill:none;stroke:var(--${up?'pos':'neg'});stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round" vector-effect="non-scaling-stroke"/></svg>`;
}

/* ---------- my stocks: advice per holding ---------- */
const ACT={add:'לקנות עוד',sell:'למכור',hold:'לחכות'}, AICON={add:'🟢',sell:'🔴',hold:'🟡'}, AORD={sell:3,add:2,hold:1};
const toILS=(s,x)=>x*(s.currency==='ILA'?0.01:s.currency==='USD'?((D.market||{}).usdils||3.7):1);
function holdPlan(s,h){
  // stop / target for this holding. Custom values win. Otherwise: from the buy price, and once in profit the stop trails today's stop.
  const ex=s.consult.exit||{}, sp=ex.stop_pct??-0.08, tp=ex.target_pct??0.15, p=s.price, c=h.cost;
  let stop=h.stop, target=h.target, auto={stop:!h.stop,target:!h.target};
  const pk=Math.max(h.peak||0,p);
  if(!stop) stop=c?(pk>c?Math.max(ex.stop||0,c*(1+sp),pk*(1+sp)):c*(1+sp)):null;
  if(!target) target=c?c*(1+tp):null;
  return {stop,target,auto};
}
function holdAdvice(s,h,weight){
  const v=s.consult.verdict, p=s.price, c=h.cost, g=c?p/c-1:null, pl=holdPlan(s,h), why=[];
  const gtxt=g==null?'':`אתה ב${g>=0?'רווח':'הפסד'} של ${L(Math.abs(g*100).toFixed(1)+'%')}.`;
  if(pl.stop&&p<=pl.stop){
    why.push(`המחיר (${num(p)}) ירד לנקודת עצירת ההפסד שלך (${num(pl.stop)}).`, gtxt, 'מוכרים כדי שהפסד קטן לא יהפוך לגדול. זו בדיוק הסיבה שקובעים את הנקודה מראש.');
    return {act:'sell',title:'למכור: הגיעה לעצירת הפסד',why};
  }
  if(v==='avoid'){
    why.push(`הבדיקה של המניה אומרת "לא לקנות": ${s.consult.summary}`, gtxt, g!=null&&g>0?'כדאי לשקול לממש את הרווח לפני שהוא נמחק.':'כשהעסק או המגמה נחלשים, עדיף לצאת לפני שההפסד גדל.');
    return {act:'sell',title:'למכור: המניה נחלשה',why};
  }
  if(pl.target&&p>=pl.target){
    if(v==='buy'){
      why.push(`הגעת ליעד הרווח (${num(pl.target)}). ${gtxt}`,'המגמה עדיין חזקה, אז אפשר להמשיך להחזיק, אבל לא להוסיף במחיר הזה.',pl.stop?`אם המחיר יורד ל-${num(pl.stop)}, למכור ולשמור על הרווח.`:'');
      return {act:'hold',title:'לחכות: הגעת ליעד, להחזיק עם הגנה',why};
    }
    why.push(`הגעת ליעד הרווח (${num(pl.target)}). ${gtxt}`,`הבדיקה של המניה כרגע: ${s.consult.summary}`,'אפשר למכור חלק (למשל חצי) ולהשאיר את השאר עם עצירת הפסד.');
    return {act:'sell',title:'למכור חלק: לממש רווח',why};
  }
  if(v==='buy'){
    if(weight>0.25){
      why.push(`המניה במצב טוב, אבל היא כבר ${L(Math.round(weight*100)+'%')} מהתיק שלך.`,'לא כדאי לשים יותר מרבע מהכסף במניה אחת. עדיף להחזיק ולא להוסיף.',gtxt);
      return {act:'hold',title:'לחכות: כבר יש לך הרבה ממנה',why};
    }
    why.push(`הבדיקה של המניה אומרת "לקנות עכשיו": ${s.consult.summary}`,gtxt,'אם מוסיפים, עדיף בהדרגה, ולשמור על עצירת ההפסד.');
    return {act:'add',title:'לקנות עוד',why};
  }
  why.push(`הבדיקה של המניה אומרת "לחכות": ${s.consult.summary}`,gtxt,'להחזיק את מה שיש, לא להוסיף כרגע. ההמלצה תתעדכן כל יום.');
  return {act:'hold',title:'לחכות: להחזיק, לא להוסיף',why};
}
function holdRows(){
  const rows=Object.keys(H).map(sym=>{const s=byS(sym),h=H[sym];return {sym,s,h,val:s?toILS(s,h.qty*s.price):0,cost:s&&h.cost?toILS(s,h.qty*h.cost):null}});
  const tot=rows.reduce((a,r)=>a+r.val,0);
  rows.forEach(r=>{r.w=tot?r.val/tot:0; r.adv=r.s?holdAdvice(r.s,r.h,r.w):null});
  return {rows,tot};
}

function matches(q){

    if(a===n||a.replace(/ta$/,'')===n)sc=100;else if(b===n)sc=90;else if(b.startsWith(n)||a.startsWith(n))sc=70;else if(c.startsWith(n))sc=60;else if(b.includes(n)||c.includes(n))sc=40;return [sc,s]})

function chartHTML(s){
  const a=s.spark||[]; if(a.length<5) return '';
  const ex=s.consult.exit||{}, W=320, Hh=150, pad=8;
  let lo=Math.min(...a), hi=Math.max(...a);
  const lines=[]; if(ex.target)lines.push([ex.target,'pos']); if(ex.stop)lines.push([ex.stop,'neg']);
  lines.forEach(([v])=>{lo=Math.min(lo,v);hi=Math.max(hi,v)});
  const r=hi-lo||1, y=v=>(pad+(hi-v)/r*(Hh-2*pad)).toFixed(1), x=i=>(i/(a.length-1)*W).toFixed(1);
  const pts=a.map((v,i)=>x(i)+','+y(v)).join(' '), ch=a[a.length-1]/a[0]-1, col=ch>=0?'var(--pos)':'var(--neg)';
  return `<div class="chart"><div class="lg"><span><b style="color:var(--ink)">שנה אחרונה</b> <span class="${cls(ch)}">${pct(ch)}</span></span><span>גבוה ${num(Math.max(...a))} · נמוך ${num(Math.min(...a))}</span></div>
   <svg viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none" role="img" aria-label="גרף המחיר בשנה האחרונה">
    <defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${col};stop-opacity:.25"/><stop offset="1" style="stop-color:${col};stop-opacity:0"/></linearGradient></defs>
    <polygon points="0,${Hh} ${pts} ${W},${Hh}" fill="url(#cg)"/>
    ${lines.map(([v,c])=>`<line x1="0" x2="${W}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--${c});stroke-width:1.2;stroke-dasharray:5 4" vector-effect="non-scaling-stroke"/>`).join('')}
    <polyline points="${pts}" style="fill:none;stroke:${col};stroke-width:2.2;stroke-linejoin:round" vector-effect="non-scaling-stroke"/>
   </svg>${lines.length?`<div class="lg"><span><span class="pos">┄</span> יעד רווח ${num(ex.target)}</span><span><span class="neg">┄</span> עצירת הפסד ${num(ex.stop)}</span></div>`:''}</div>`;
}
async function openStock(sym){
  const s0=byS(sym); if(!s0) return;
  if(!$('#pg').classList.contains('on')||$('#pg').dataset.sym!==sym) showPage(`<div class="pbar"><h2 style="margin:0">${esc(nm(s0))}</h2><button class="x" onclick="closePage()" aria-label="סגירה">✕</button></div><div class="skel" style="height:90px;border-radius:16px"></div><div class="skel" style="height:150px;border-radius:16px"></div><div class="skel"></div><div class="skel" style="width:70%"></div>`,0,sym);
  $('#pg').dataset.sym=sym;
  let s; try{s=await detail(sym)}catch(e){$('#pg .spin').textContent='לא הצלחתי לטעון. נסה שוב בעוד רגע.';return}
  if($('#pg').dataset.sym!==sym) return;
  if(W[sym]){W[sym].seen=s.consult.verdict;saveW()}
  const keep=$('#pg').scrollTop;
  showPage(stockHTML(s),0,sym); $('#pg').scrollTop=keep; renderTabs(); if(tab==='watch') renderPanel();
}
function stockHTML(s){

  const waits=(c.waits||[]).length?`<h3>${v==='avoid'?'מה צריך לקרות כדי שזה ישתנה':v==='wait'?'למה לחכות ולמה':'כדאי לדעת'}</h3><ul class="plain">${c.waits.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>`:'';
  const plan=ex.target?`<section class="card"><h2>${v==='buy'?'אם קונים, זו התוכנית':'אם תקנה בהמשך, התוכנית לפי המחיר היום'}</h2>

    <div><span>🛑 למכור ולעצור הפסד אם המחיר יורד ל-</span><b class="neg">${num(ex.stop)}</b><span>${pct(ex.stop_pct,1)} מהמחיר היום</span></div></div>

  const lvl=s.risk.level;

  return `<div class="pbar"><div><h2 style="margin:0;font-size:24px">${esc(nm(s))}</h2><div class="muted small">${esc(s.symbol)}${s.type==='etf'?'<span class="tag">קרן סל</span>':''} · ${esc(s.group?gName(s.group):(SECT[s.sector]||s.sector||''))} · מחיר ${num(s.price)} ${cur(s)}${s.metrics.ret_1d!=null?` · היום <span class="${cls(s.metrics.ret_1d)}">${pct(s.metrics.ret_1d,1)}</span>`:''}</div></div><button class="x" onclick="closePage()" aria-label="סגירה">✕</button></div>
   <div class="verdict vb-${v}"><div class="small" style="opacity:.85">ההמלצה של הכלי</div><div class="big">${VICON[v]} ${VERD[v]}</div><p>${esc(c.summary)}</p>${s.type==='etf'?'<p class="small" style="opacity:.85">זו קרן סל: סל של הרבה מניות. אין לה דוחות של חברה אחת, לכן הבדיקה נשענת בעיקר על המגמה, התזמון והסיכון.</p>':''}</div>
   ${chartHTML(s)}
   ${signalsHTML(c)}
   <div class="acts"><button class="btn2 ${W[s.symbol]?'on':''}" onclick="toggleWatch('${esc(s.symbol)}')">${W[s.symbol]?'★ במעקב':'☆ לעקוב'}</button>
     <button class="btn2 ${CMP.includes(s.symbol)?'on':''}" onclick="toggleCmp('${esc(s.symbol)}')">${CMP.includes(s.symbol)?'✓ בהשוואה':'⇄ להשוות'}</button>
     <button class="btn2" onclick="$('#buyf').hidden=!$('#buyf').hidden;if(!$('#buyf').hidden)$('#bqty').focus()">🛒 קניתי</button>
     <button class="btn2" onclick="shareStock('${esc(s.symbol)}')">📤 שיתוף</button></div>
   <form id="buyf" class="card" hidden style="margin:10px 0 0" onsubmit="boughtNow(event,'${esc(s.symbol)}')" autocomplete="off">
     <h3 style="margin-top:0">${H[s.symbol]?'קנית עוד? הכלי יצרף ויחשב מחיר ממוצע':'קנית את המניה? מכאן הכלי עוקב אחריה בשבילך'}</h3>
     <div class="hedit"><label>כמה יחידות קנית<input class="inp" id="bqty" type="number" inputmode="decimal" step="any" min="0" required></label>

     <p class="muted tiny">המחיר ממולא לפי המחיר האחרון באתר. אם שילמת מחיר אחר, תקן אותו.</p>
     <button class="btn" style="width:100%" type="submit">שמור את הקנייה</button></form>
   ${CMP.length>=2&&CMP.includes(s.symbol)?`<button class="btn more" onclick="openCompare()">השווה עכשיו: ${CMP.map(x=>esc(nm(byS(x)))).join(' מול ')}</button>`:CMP.length===1&&CMP.includes(s.symbol)?'<p class="muted tiny" style="margin:6px 0 0">עכשיו פתח מניה נוספת ולחץ "להשוות".</p>':''}
   ${W[s.symbol]?`<p class="small" style="margin:8px 0 0">התראה כשהמחיר יורד ל: <input type="number" inputmode="decimal" step="any" value="${W[s.symbol].target??''}" placeholder="מחיר" style="width:110px;font:inherit;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)" onchange="W['${esc(s.symbol)}'].target=this.value?+this.value:null;saveW()"></p>`:''}
   ${holdHTML(s)}
   <section class="card" style="margin-top:12px"><h2>למה?</h2><ul class="why">${reasons}</ul>${waits}</section>
   ${plan}
   <section class="card"><h2>כמה זה מסוכן?</h2><div class="meter">${[1,2,3,4,5].map(i=>`<i class="${i<=lvl?'f'+lvl:''}"></i>`).join('')}</div>
     <b>${RISKW[lvl]} (${lvl} מתוך 5)</b><div class="small">${RISKS[lvl]}</div>
     ${m.max_dd!=null?`<div class="small muted" style="margin-top:4px">בשנה האחרונה: ${pct(m.ret_1y)} בסך הכול. בשלב הכי גרוע היא הייתה ${L(Math.round(Math.abs(m.max_dd)*100)+'%')} מתחת לשיא.</div>`:''}</section>
   <details><summary>כל ${c.checks.length} הבדיקות (${c.counts.good} טובות, ${c.counts.ok} בינוניות, ${c.counts.bad} חלשות)</summary><ul class="why">${checks}</ul></details>
   ${(s.news||[]).length?`<details><summary>חדשות אחרונות (באנגלית)</summary><div class="news"><ul>${s.news.map(n=>`<li><a href="${esc(n.link)}" target="_blank" rel="noopener">${esc(n.title)}</a> <span class="muted tiny">${esc(n.source)}${n.date?' · '+new Date(n.date).toLocaleDateString('he-IL'):''}</span></li>`).join('')}</ul></div></details>`:''}
   ${s.about?`<details><summary>מה החברה עושה (באנגלית)</summary><p class="small" dir="ltr" style="text-align:left">${esc(s.about)}</p></details>`:''}
   <details><summary>מספרים למתקדמים</summary><div class="mt">
     ${mt('חודש',`<span class="${cls(m.ret_1m)}">${pct(m.ret_1m,1)}</span>`)}${mt('חצי שנה',`<span class="${cls(m.ret_6m)}">${pct(m.ret_6m,1)}</span>`)}${mt('שנה',`<span class="${cls(m.ret_1y)}">${pct(m.ret_1y,1)}</span>`)}
     ${mt('מכפיל רווח',num(f.trailingPE,1))}${mt('מכפיל רווח עתידי',num(f.forwardPE,1))}${mt('שולי רווח',pct(f.profitMargins))}
     ${mt('תשואה על ההון',pct(f.returnOnEquity))}${mt('צמיחת הכנסות',pct(f.revenueGrowth))}${mt('דיבידנד',f.dividendYield!=null?L(num(f.dividendYield)+'%'):'—')}
     ${mt('RSI',num(m.rsi14,0))}${mt('ממוצע 50 יום',num(m.ma50))}${mt('ממוצע 200 יום',num(m.ma200))}
     ${mt('בטא',num(m.beta))}${mt('יעד אנליסטים',num(f.targetMeanPrice))}${mt('דוח הבא',s.earnings&&s.earnings.next?esc(s.earnings.next):'—')}</div>
     <p class="muted tiny">ציון כולל ${L(c.score)} (מ-100- עד 100+), ביטחון ${esc(c.confidence)}.</p></details>
   <p class="muted tiny" style="margin-top:14px">נכון לנתוני ${new Date(D.generated_at).toLocaleDateString('he-IL')}. לא ייעוץ השקעות. ההחלטה והאחריות שלך.</p>`;
}
function toggleWatch(sym){const s=byS(sym);if(W[sym])delete W[sym];else W[sym]={target:null,seen:s&&s.consult.verdict};saveW();toast(W[sym]?'★ נוסף למעקב':'הוסר מהמעקב');renderTabs();if(tab==='watch')renderPanel();openStock(sym)}
function toggleCmp(sym){const i=CMP.indexOf(sym);if(i>=0)CMP.splice(i,1);else{if(CMP.length>=3)CMP.shift();CMP.push(sym)};renderTbar();openStock(sym)}
function renderTbar(){
  const b=$('#tbar');b.classList.toggle('on',CMP.length>0);
  b.innerHTML=`<span>להשוואה: ${CMP.map(x=>esc(nm(byS(x)))).join(', ')}</span>${CMP.length>=2?'<button style="background:var(--accent);color:#fff" onclick="openCompare()">השווה</button>':'<span style="opacity:.7;flex:none">בחר עוד מניה</span>'}<button style="background:transparent;color:inherit" onclick="CMP=[];renderTbar()" aria-label="ניקוי">✕</button>`;
}
async function openCompare(){
  showPage(`<div class="pbar"><h2 style="margin:0">השוואה</h2><button class="x" onclick="closePage()">✕</button></div><div class="spin">טוען…</div>`,true,'');
  $('#pg').dataset.sym='';
  let S; try{S=await Promise.all(CMP.map(detail))}catch(e){$('#pg .spin').textContent='לא הצלחתי לטעון.';return}
  const best=[...S].sort((a,b)=>(VORD[b.consult.verdict]*1000+b.consult.score)-(VORD[a.consult.verdict]*1000+a.consult.score))[0];
  const ic={good:'✓',ok:'!',bad:'✕',na:'?'};
  const row=(t,fn)=>`<tr><th>${t}</th>${S.map(s=>`<td>${fn(s)}</td>`).join('')}</tr>`;
  showPage(`<div class="pbar"><h2 style="margin:0">השוואה</h2><button class="x" onclick="closePage()" aria-label="סגירה">✕</button></div>
   <p>מבין ${S.length} המניות, <b>${esc(nm(best))}</b> נמצאת במצב הכי טוב לפי הבדיקה.</p>
   <div class="card tw"><table class="cmp"><thead><tr><th></th>${S.map(s=>`<th><a href="#" onclick="openStock('${esc(s.symbol)}');return false" style="color:inherit">${esc(nm(s))}</a></th>`).join('')}</tr></thead><tbody>
    ${row('המלצה',s=>`<span class="vd v-${s.consult.verdict}">${VERD[s.consult.verdict]}</span>`)}
    ${row('כמה מסוכן',s=>RISKW[s.risk.level])}
    ${row('בשנה האחרונה',s=>`<span class="${cls(s.metrics.ret_1y)}">${pct(s.metrics.ret_1y)}</span>`)}
    ${row('יעד רווח / עצירת הפסד',s=>s.consult.exit&&s.consult.exit.target?`<span class="pos">${pct(s.consult.exit.target_pct)}</span> / <span class="neg">${pct(s.consult.exit.stop_pct)}</span>`:'—')}
    ${S[0].consult.checks.map(k=>row(esc(k.name),s=>{const c=s.consult.checks.find(x=>x.key===k.key);return c?`<span class="ic ${c.status}" style="display:inline-grid;width:20px;height:20px;font-size:11px;vertical-align:middle">${ic[c.status]}</span> <span class="small">${esc(c.plain)}</span>`:'—'})).join('')}
   </tbody></table></div><p class="muted tiny">לא ייעוץ השקעות.</p>`,true);
}
function openGlossary(){
  showPage(`<div class="pbar"><h2 style="margin:0">מילון מושגים</h2><button class="x" onclick="closePage()" aria-label="סגירה">✕</button></div>
  <dl class="gl">
   <dt>מניה</dt><dd>חלק קטן מחברה. כשהחברה מצליחה, המחיר בדרך כלל עולה, וכשהיא נכשלת הוא יורד.</dd>
   <dt>סימול</dt><dd>השם הקצר של המניה בבורסה, למשל AAPL לאפל. מניות בתל אביב מסתיימות ב-.TA.</dd>
   <dt>לקנות עכשיו / לחכות / לא לקנות</dt><dd>הסיכום של 14 בדיקות. "לחכות" לא אומר שהחברה גרועה, אלא שהרגע לא מתאים, למשל לפני דוח רווחים או אחרי קפיצה חדה.</dd>
   <dt>יעד רווח</dt><dd>המחיר שבו כדאי לשקול למכור ולקחת את הרווח.</dd>
   <dt>עצירת הפסד (סטופ-לוס)</dt><dd>מחיר שקובעים מראש: אם המניה יורדת אליו, מוכרים. ככה הפסד קטן לא הופך לגדול.</dd>
   <dt>דוח רווחים</dt><dd>פעם ברבעון החברה מפרסמת כמה מכרה והרוויחה. ביום הזה המחיר יכול לקפוץ או לצנוח.</dd>
   <dt>כמה המניה קופצת (סיכון)</dt><dd>עד כמה המחיר עולה ויורד. מניה "רגועה" זזה מעט, ומניה ש"קופצת חזק" יכולה לרדת הרבה בזמן קצר.</dd>
   <dt>מגמה</dt><dd>הכיוון של המחיר בחודשים האחרונים: עולה, יורד או בלי כיוון.</dd>
   <dt>מכפיל רווח</dt><dd>כמה שנים של רווח אתה משלם במחיר המניה. נמוך פירושו זול, גבוה פירושו יקר.</dd>
   <dt>אנליסטים</dt><dd>מומחים בבנקים ובבתי השקעות שעוקבים אחרי החברה ונותנים המלצה ומחיר יעד.</dd>
   <dt>קרן סל (ETF)</dt><dd>מוצר שקונים כמו מניה, אבל הוא סל של הרבה מניות (למשל כל 500 החברות הגדולות בארה"ב) או של זהב ואג"ח. פיזור מובנה, ולכן בדרך כלל פחות מסוכן ממניה בודדת.</dd>
   <dt>מחיר כניסה טוב</dt><dd>מניה שנמצאת במגמה עולה, ירדה קצת ונחה ליד קו תמיכה (הממוצע של 20 או 50 הימים האחרונים). לקנות שם עדיף בדרך כלל על לקנות בשיא.</dd>
   <dt>סימנים לעלייה קרובה</dt><dd>דברים שלעיתים קרובות מקדימים עלייה: נפח מסחר חריג בימי עלייה, מומנטום שמתהפך למעלה, מניה חזקה מהשוק, סקטור שכסף זורם אליו, דוח קרוב אחרי רצף של הפתעות חיוביות, הרבה שורט שעלול להיסגר. אלה סימנים, לא הבטחה.</dd>
   <dt>במגמת עלייה</dt><dd>מניה שהמחיר שלה מעל הממוצע של 200 הימים האחרונים ועלה בחודשים האחרונים. זה לא מבטיח שתמשיך לעלות.</dd>
   <dt>מדד (S&P 500, ת"א 125)</dt><dd>סל של הרבה מניות גדולות. משמש כדי לדעת מה מצב הבורסה כולה.</dd>
   <dt>מדד הפחד (VIX)</dt><dd>מודד כמה המשקיעים לחוצים. מספר גבוה פירושו פחד ותנודות חזקות.</dd>
   <dt>לקנות בהדרגה</dt><dd>במקום לקנות בבת אחת, קונים בכמה פעמים לאורך כמה שבועות. ככה לא נתפסים בשיא.</dd>
   <dt>פיזור</dt><dd>לא לשים את כל הכסף במניה אחת. אם אחת נופלת, האחרות מאזנות.</dd>
  </dl>
  <p class="small"><b>כלל אצבע:</b> משקיעים רק כסף שלא צריך בשנים הקרובות, ולא כסף שאי אפשר להרשות לעצמך להפסיד.</p>`);
}

  if(d.synthetic)$('#warn').innerHTML+='<div class="warnbox">נתוני הדגמה אקראיים, לא נתוני אמת.</div>';
  if((Date.now()-dt)/864e5>4)$('#warn').innerHTML+='<div class="warnbox">הנתונים לא עודכנו כמה ימים. ייתכן שהעדכון האוטומטי נכשל.</div>';
  trackPeaks(); renderIdx(); renderMarket(); renderCats(); renderTabs(); renderPanel(); renderTrack(); renderTbar();
  const h=decodeURIComponent(location.hash.slice(1)); if(h&&byS(h)) openStock(h);
}).catch(e=>{$('#updated').textContent='לא הצלחתי לטעון את הנתונים. נסה לרענן.'});
</script>
