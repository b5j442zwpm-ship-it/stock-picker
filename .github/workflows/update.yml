name: Update stock data

on:
  schedule:
    # Weekdays 21:45 UTC, after the US close (and long after Tel Aviv closes)
    - cron: "45 21 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tickers.txt", "watchlist.txt", "scripts/**", ".github/workflows/update.yml"]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/build_data.py
      - name: Commit data
        run: |
          git config user.name "stock-picker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/history.json
          git diff --cached --quiet && exit 0
          git commit -m "Update data $(date -u +%F)"
          for i in 1 2 3 4; do git pull --rebase && git push && exit 0; echo "push failed, retry $i"; sleep $((i * 20)); done
          exit 1
